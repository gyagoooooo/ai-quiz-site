<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SSAFY AI Quiz Note</title><link rel="stylesheet" href="style.css"></head><body><main class="shell"><header class="top"><div class="brand"><h1>SSAFY AI Quiz Note</h1><p>문제 풀이 · 자동 채점 · 해설 확인 · 오답노트</p></div><div class="stats"><div class="stat"><span>전체</span><b id="total">0</b></div><div class="stat"><span>풀이</span><b id="solved">0</b></div><div class="stat"><span>오답</span><b id="wrong">0</b></div></div></header><div class="tabs"><button class="tab active" data-view="all">전체 문제</button><button class="tab" data-view="unanswered">미풀이</button><button class="tab" data-view="wrong">오답노트</button></div><section class="grid"><aside class="panel filters"><h3>문제 필터</h3><label>파일</label><select id="source"></select><label>유형</label><select id="type"><option value="">전체 유형</option><option>객관식</option><option>주관식</option><option>서술형</option></select><label>검색</label><input id="search" placeholder="예: Attention, CNN"><p class="note">현재 <b id="count">0</b>문제 표시 중</p><button class="btn danger" onclick="resetAll()">학습 기록 초기화</button><p class="note">기록은 이 브라우저의 localStorage에 저장됩니다.</p></aside><section class="list panel" id="list"></section></section></main><script src="data.js"></script><script src="app.js"></script></body></html>
