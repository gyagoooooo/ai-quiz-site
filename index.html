<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SSAFY AI Quiz Note</title><style>:root{--bg:#f6f7fb;--card:#fff;--text:#172033;--muted:#6b7280;--line:#e5e7eb;--primary:#4f46e5;--good:#15803d;--bad:#b91c1c;--chip:#eef2ff}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Pretendard","Noto Sans KR",sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}.shell{max-width:1180px;margin:auto;padding:24px}.top{display:flex;gap:16px;align-items:center;justify-content:space-between;margin-bottom:18px}.brand h1{margin:0;font-size:28px}.brand p{margin:6px 0 0;color:var(--muted)}.stats{display:flex;gap:8px;flex-wrap:wrap}.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;min-width:92px}.stat b{display:block;font-size:20px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.tab,.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;cursor:pointer}.tab.active,.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.grid{display:grid;grid-template-columns:280px 1fr;gap:18px}.panel,.card{background:var(--card);border:1px solid var(--line);border-radius:16px}.panel{padding:16px;position:sticky;top:16px;height:max-content}.filters label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}.filters select,.filters input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:white}.list{padding:18px}.qcard{border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:14px;background:#fff}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.chip{background:var(--chip);color:#3730a3;border-radius:999px;padding:4px 9px;font-size:12px}.qtitle{font-weight:750;font-size:18px;line-height:1.5;margin:8px 0}.qbody{white-space:pre-wrap;line-height:1.65}.choices{display:grid;gap:8px;margin-top:14px}.choice{display:flex;gap:10px;border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}.choice:hover{border-color:#a5b4fc}.choice input{margin-top:3px}.textarea{width:100%;min-height:100px;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:12px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.feedback{margin-top:12px;border-radius:12px;padding:12px;white-space:pre-wrap;line-height:1.6}.feedback.good{background:#ecfdf5;color:var(--good)}.feedback.bad{background:#fef2f2;color:var(--bad)}.answer{margin-top:12px;background:#f8fafc;border-left:4px solid #94a3b8;padding:12px;white-space:pre-wrap;line-height:1.6}.empty{text-align:center;padding:56px 16px;color:var(--muted)}.note{font-size:13px;color:var(--muted);margin-top:10px}.danger{color:var(--bad)}@media(max-width:820px){.shell{padding:14px}.grid{grid-template-columns:1fr}.panel{position:static}.top{align-items:flex-start;flex-direction:column}.brand h1{font-size:23px}}</style></head><body><main class="shell"><header class="top"><div class="brand"><h1>SSAFY AI Quiz Note</h1><p>문제 풀이 · 자동 채점 · 해설 확인 · 오답노트</p></div><div class="stats"><div class="stat"><span>전체</span><b id="total">0</b></div><div class="stat"><span>풀이</span><b id="solved">0</b></div><div class="stat"><span>오답</span><b id="wrong">0</b></div></div></header><div class="tabs"><button class="tab active" data-view="all">전체 문제</button><button class="tab" data-view="unanswered">미풀이</button><button class="tab" data-view="wrong">오답노트</button></div><section class="grid"><aside class="panel filters"><h3>문제 필터</h3><label>파일</label><select id="source"></select><label>유형</label><select id="type"><option value="">전체 유형</option><option>객관식</option><option>주관식</option><option>서술형</option></select><label>검색</label><input id="search" placeholder="예: Attention, CNN"><p class="note">현재 <b id="count">0</b>문제 표시 중</p><button class="btn danger" onclick="resetAll()">학습 기록 초기화</button><p class="note">기록은 이 브라우저의 localStorage에 저장됩니다.</p></aside><section class="list panel" id="list"></section></section></main><script>(async()=>{const names=["data1.txt","data2.txt","data3.txt","data4.txt","data5.txt"];const b64=(await Promise.all(names.map(n=>fetch(n).then(r=>r.text())))).join('');const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');window.QUIZ_DATA=JSON.parse(await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text());const data=window.QUIZ_DATA||[];const KEY='ssafy-ai-quiz-v1';const state=JSON.parse(localStorage.getItem(KEY)||'{"answers":{},"wrong":{},"reviewed":{}}');let view='all';const $=s=>document.querySelector(s);function save(){localStorage.setItem(KEY,JSON.stringify(state));renderStats()}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(s=''){return esc(s).replace(/\*\*(.*?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\n/g,'<br>')}function sources(){return [...new Set(data.map(q=>q.source))]}function renderFilters(){$('#source').innerHTML='<option value="">전체 파일</option>'+sources().map(s=>`<option>${esc(s)}</option>`).join('')}function filtered(){let arr=data;const s=$('#source').value,typ=$('#type').value,word=$('#search').value.trim().toLowerCase();if(s)arr=arr.filter(q=>q.source===s);if(typ)arr=arr.filter(q=>q.type===typ);if(word)arr=arr.filter(q=>(q.title+' '+q.body+' '+q.answer).toLowerCase().includes(word));if(view==='wrong')arr=arr.filter(q=>state.wrong[q.id]);if(view==='unanswered')arr=arr.filter(q=>state.answers[q.id]==null);return arr}function renderStats(){const solved=Object.keys(state.answers).length,wrong=Object.keys(state.wrong).length;$('#total').textContent=data.length;$('#solved').textContent=solved;$('#wrong').textContent=wrong}function card(q){const prev=state.answers[q.id];let input='';if(q.choices.length){input=`<div class="choices">${q.choices.map(c=>`<label class="choice"><input type="radio" name="${esc(q.id)}" value="${c.key}" ${prev===c.key?'checked':''}><span><b>${esc(c.label)}</b> ${fmt(c.text)}</span></label>`).join('')}</div>`}else{input=`<textarea class="textarea" data-text="${esc(q.id)}" placeholder="여기에 답안을 작성하세요.">${esc(prev||'')}</textarea>`}let fb='';if(state.reviewed[q.id]){const bad=state.wrong[q.id];fb=`<div class="feedback ${bad?'bad':'good'}">${bad?'오답노트에 저장됨':'정답/완료로 기록됨'}</div><div class="answer"><b>정답 및 해설</b><br>${fmt(q.answer||'첨부 자료에 별도 해설이 없습니다.')}</div>`}return `<article class="qcard" data-id="${esc(q.id)}"><div class="meta"><span class="chip">${esc(q.source)}</span>${q.group?`<span class="chip">${esc(q.group)}</span>`:''}<span class="chip">${esc(q.type)}</span><span class="chip">#${esc(q.number)}</span></div><div class="qtitle">${fmt(q.title||'문제 '+q.number)}</div><div class="qbody">${fmt(q.body)}</div>${input}<div class="actions">${q.choices.length?`<button class="btn primary" onclick="grade('${q.id}')">채점하기</button>`:`<button class="btn primary" onclick="reveal('${q.id}')">모범답안 확인</button>`}<button class="btn" onclick="mark('${q.id}',true)">오답으로 저장</button><button class="btn" onclick="mark('${q.id}',false)">정답/완료</button></div>${fb}</article>`}function render(){const arr=filtered();$('#count').textContent=arr.length;$('#list').innerHTML=arr.length?arr.map(card).join(''):'<div class="empty">조건에 맞는 문제가 없습니다.</div>'}window.grade=id=>{const q=data.find(x=>x.id===id);const el=document.querySelector(`input[name="${CSS.escape(id)}"]:checked`);if(!el)return alert('답을 먼저 선택해 주세요.');state.answers[id]=el.value;if(q.correct){state.wrong[id]=el.value!==q.correct;if(!state.wrong[id])delete state.wrong[id]}else{state.wrong[id]=true}state.reviewed[id]=true;save();render()};window.reveal=id=>{const ta=document.querySelector(`[data-text="${CSS.escape(id)}"]`);state.answers[id]=ta?ta.value:'';state.reviewed[id]=true;save();render()};window.mark=(id,bad)=>{const ta=document.querySelector(`[data-text="${CSS.escape(id)}"]`);if(ta)state.answers[id]=ta.value;else{const el=document.querySelector(`input[name="${CSS.escape(id)}"]:checked`);if(el)state.answers[id]=el.value}if(bad)state.wrong[id]=true;else delete state.wrong[id];state.reviewed[id]=true;save();render()};function tab(v){view=v;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render()}window.resetAll=()=>{if(confirm('저장된 풀이/오답 기록을 모두 초기화할까요?')){localStorage.removeItem(KEY);location.reload()}};renderFilters();['source','type','search'].forEach(id=>$('#'+id).addEventListener(id==='search'?'input':'change',render));document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>tab(b.dataset.view));renderStats();render()})();</script></body></html>
